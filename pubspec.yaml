name: earnlens
description: "EarnLens — personal earnings intelligence, live income tracker and financial dashboard. Offline-first."
publish_to: 'none'
version: 2.0.1+2

environment:
  sdk: ^3.13.7

dependencies:
  collection: ^1.19.1
  cryptography: ^2.9.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.1
  home_widget: ^0.10.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
    # Supplied app icon (source of truth) and the cropped in-app brand mark.
    - assets/images/
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Variable.ttf
